<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="跟毒舌的 Dylan 山羊老師吵架，用選擇題回嘴，底氣歸零就輸，看你能撐幾回合。">
<title>不服來辯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}

/* Layout: one exam sheet on a desk mat; the teacher writes in red pen, you answer like a multiple-choice test. Single committed light look. */
:root{
  color-scheme: light;
  --wall:#dfe2d6;
  --paper:#f4f6f3;
  --rule:#c8d5e2;
  --margin:#e6a3a0;
  --ink:#1e2330;
  --pencil:#5b6270;
  --red:#cc2e2a;
  --red-soft:#f6dcda;
  --good:#1f7a4d;
  --f-print:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-pen:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;
  --mx:52px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--f-print);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:clamp(56px,13vh,150px) 40px}
.room{position:fixed;inset:0;z-index:-1;pointer-events:none}
.room svg{width:100%;height:100%;display:block}
.paper{z-index:0}
.paper{max-width:700px;margin:0 auto;background:var(--paper);
  box-shadow:0 1px 0 #b9c3bf,0 18px 40px -18px rgba(30,40,50,.35);
  padding:28px 28px 32px;border-radius:6px;position:relative;min-height:520px}
@media (max-width:520px){.paper{padding:20px 16px 24px}}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.goat{display:block;width:64px;height:auto;margin-bottom:2px}
h1{margin:2px 0 0;font-weight:900;font-size:28px;letter-spacing:.06em;text-wrap:balance}
.meta{font-size:13px;color:var(--pencil);display:flex;gap:14px;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-size:16px}

.gauge{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:16px 0 4px;font-size:13px}
.gauge span{font-variant-numeric:tabular-nums;min-width:3ch;text-align:right;font-weight:700}
.ruler{height:16px;border:1.5px solid var(--ink);position:relative;overflow:hidden;background:
  repeating-linear-gradient(to right,var(--ink) 0 1px,transparent 1px 10%)}
.ruler i{position:absolute;inset:0 auto 0 0;width:100%;background:#f2c94c;transition:width .45s ease,background .3s;mix-blend-mode:multiply}
.ruler.low i{background:var(--red)}
.gauge-note{font-size:11px;color:var(--pencil);margin:0 0 10px}

/* intro */
.intro-lines{min-height:250px;display:flex;flex-direction:column;gap:6px;margin-top:18px}
.pen{font-family:var(--f-pen);color:var(--red);font-size:20px;line-height:34px;margin:0}
.who{font-size:13px;color:var(--pencil);margin:18px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mood{font-size:12px;border:1px solid var(--pencil);padding:1px 8px;border-radius:99px;color:var(--pencil);background:var(--paper)}
.mood.hot{border-color:var(--red);color:var(--red)}
.mood.cool{border-color:var(--good);color:var(--good)}
.stampwrap{display:flex;justify-content:center;margin:14px 0 6px;min-height:150px;align-items:center}
.stamp{font-family:var(--f-pen);font-weight:700;color:var(--red);border:5px solid var(--red);border-radius:6px;
  display:grid;grid-template-columns:1fr 1fr;width:132px;height:132px;place-items:center;font-size:46px;line-height:1;
  transform:rotate(-8deg);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--red);opacity:.92;
  animation:stamp .38s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:.92}}

.btn{font-family:var(--f-print);font-weight:700;font-size:16px;background:var(--ink);color:var(--paper);border:0;padding:12px 22px;border-radius:3px;cursor:pointer;letter-spacing:.06em}
.btn:hover{background:#000}
.btn.ghost{background:transparent;color:var(--pencil);border:1px dashed var(--pencil);font-weight:500;font-size:14px;padding:8px 14px}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #f2c94c;outline-offset:2px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hint{font-size:12px;color:var(--pencil)}

/* play */
.say-box{margin-top:6px;cursor:pointer}
.say{min-height:68px}
.timer{height:4px;background:var(--rule);margin:8px 0 18px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--ink);transform-origin:left}
.timer.urgent i{background:var(--red)}
.qlabel{font-size:13px;color:var(--pencil);margin:0 0 6px;letter-spacing:.08em}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:left;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;background:transparent;border:0;
  font-family:var(--f-print);font-size:16px;line-height:1.6;color:var(--ink);padding:6px 6px 6px 0;cursor:pointer;border-radius:3px}
.opt:hover:not(:disabled){background:rgba(242,201,76,.22)}
.bubble{width:26px;height:26px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.opt.picked .bubble{background:var(--ink);color:var(--paper);box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--pencil)}
.opt:disabled{cursor:default}
.opt.faded{opacity:.35}
.opt.best:not(.picked) .txt{text-decoration:underline wavy var(--good);text-underline-offset:5px}

.result{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.mark{font-family:var(--f-pen);font-weight:700;font-size:54px;line-height:1;color:var(--red);transform:rotate(-6deg);animation:stamp .3s cubic-bezier(.2,1.6,.4,1) both;grid-row:span 2}
.mark.ok{color:var(--good)}
.grade{font-family:var(--f-pen);font-size:22px;font-weight:700;color:var(--red)}
.grade.ok{color:var(--good)}
.delta{font-size:13px;color:var(--pencil);font-variant-numeric:tabular-nums}
.reply{grid-column:1/-1;margin-top:8px}
.result .row{grid-column:1/-1;margin-top:10px}
.combo{font-family:var(--f-pen);color:var(--good);font-size:18px}

/* sheep avatar */
.with-av{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:start;margin-top:14px}
.with-av>div{min-width:0}
.avatar svg{width:100%;height:auto;display:block;overflow:visible}
.avatar.talking svg{animation:bob .45s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-3px) rotate(1.5deg)}}
.sheep .f,.sheep .mic{display:none}
.sheep.m-smug .smug,.sheep.m-sneer .sneer,.sheep.m-panic .panic,.sheep.m-laugh .laugh,.sheep.m-talk .talk,.sheep.m-talk .mic{display:inline}
.with-av .who{margin-top:0}
.with-av .intro-lines{margin-top:8px}
@media (max-width:520px){.with-av{grid-template-columns:76px 1fr;gap:10px}}

/* over */
.over-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:22px}
.score{width:128px;height:128px;border:4px solid var(--red);border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--red);font-family:var(--f-pen);transform:rotate(-7deg);animation:stamp .4s cubic-bezier(.2,1.6,.4,1) both}
.score b{display:block;font-size:52px;line-height:1}
.score small{font-size:13px}
.rank{font-weight:900;font-size:26px;margin:0}
.stats{margin:6px 0 0;font-size:14px;color:var(--pencil);line-height:1.8;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.new{color:var(--red);font-family:var(--f-pen);font-weight:700}
.board{margin-top:26px;border-top:2px solid var(--ink);padding-top:14px}
.board h2{margin:0;font-size:20px;font-weight:900;letter-spacing:.06em}
.board ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.board li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px dashed var(--rule);font-variant-numeric:tabular-nums}
.board li.me{background:rgba(242,201,76,.25)}
.board .rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--pencil);border:1px solid var(--rule)}
.board li:nth-child(-n+3) .rk{border:2px solid var(--red);color:var(--red);font-family:var(--f-pen);font-size:15px}
.board .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.board .nm small{font-weight:500;color:var(--pencil);margin-left:6px}
.board .sc{font-family:var(--f-pen);font-size:18px;color:var(--red)}
.board .sc small{font-family:var(--f-print);font-size:12px;color:var(--pencil);margin-left:2px}
.submit{margin-top:20px;display:flex;flex-direction:column;gap:6px}
.submit label{font-size:13px;color:var(--pencil)}
.submit input{font-family:var(--f-print);font-size:16px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:3px;background:#fff;color:var(--ink);min-width:0;flex:1 1 160px}
.submit input:focus-visible{outline:3px solid #f2c94c;outline-offset:1px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.pen{font-size:18px;line-height:30px}.opt{font-size:15px}.over-top{grid-template-columns:1fr;justify-items:start}}
</style>
</head>
<body>
<main>
<div class="room" aria-hidden="true">
<svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMin slice">
  <rect width="1600" height="1000" fill="#dfe2d6"/>
  <rect y="660" width="1600" height="170" fill="#cbd4c3"/>
  <rect y="656" width="1600" height="8" fill="#a8b49f"/>
  <!-- clock -->
  <circle cx="1530" cy="70" r="34" fill="#fbfbf7" stroke="#3b3f45" stroke-width="5"/>
  <path d="M1530 70 L1530 48 M1530 70 L1546 78" stroke="#3b3f45" stroke-width="4" stroke-linecap="round"/>
  <!-- chalkboard -->
  <rect x="90" y="40" width="1380" height="500" rx="6" fill="#8a5b36"/>
  <rect x="106" y="56" width="1348" height="468" fill="#2e4b3c"/>
  <rect x="106" y="56" width="1348" height="468" fill="url(#smudge)"/>
  <rect x="80" y="536" width="1400" height="14" rx="3" fill="#7a4f2e"/>
  <rect x="300" y="528" width="34" height="8" rx="3" fill="#f7f4ea"/><rect x="350" y="529" width="24" height="7" rx="3" fill="#f2c9c4"/><rect x="1180" y="528" width="40" height="9" rx="2" fill="#3c3c44"/>
  <defs><radialGradient id="smudge" cx=".3" cy=".4" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
  <g font-family="LXGW WenKai TC, Kaiti TC, BiauKai, serif" fill="#eef0e6" opacity=".9">
    <text x="140" y="120" font-size="34">10/25（日）</text>
    <text x="140" y="168" font-size="28">值日生：你</text>
    <text x="140" y="250" font-size="30">I am agree</text>
    <path d="M136 262 L300 228 M136 228 L300 262" stroke="#f2a6a0" stroke-width="5" stroke-linecap="round"/>
    <text x="140" y="330" font-size="30">I agree ✓</text>
    <text x="140" y="420" font-size="26" fill="#f6e08a">考試範圍：</text>
    <text x="140" y="460" font-size="26" fill="#f6e08a">Unit 3～5</text>
    <text x="1180" y="120" font-size="30">Today：</text>
    <text x="1180" y="166" font-size="30">過去式！！</text>
    <path d="M1180 180 Q1260 192 1340 178" stroke="#eef0e6" stroke-width="3" fill="none"/>
    <text x="1180" y="250" font-size="26">go → went</text>
    <text x="1180" y="292" font-size="26">eat → ate</text>
    <text x="1180" y="334" font-size="26">argue → argued</text>
    <text x="1200" y="440" font-size="40" fill="#f2a6a0">咩～</text>
  </g>
  <!-- floor -->
  <rect y="830" width="1600" height="170" fill="#b58a5e"/>
  <g stroke="#9f764d" stroke-width="3"><path d="M0 870 H1600 M0 920 H1600 M0 970 H1600"/></g>
  <!-- desks -->
  <g fill="#c9a074" stroke="#8f6a45" stroke-width="3">
    <rect x="40" y="760" width="230" height="26" rx="4"/><rect x="1330" y="760" width="230" height="26" rx="4"/>
    <rect x="-60" y="880" width="260" height="30" rx="4"/><rect x="1400" y="880" width="260" height="30" rx="4"/>
  </g>
  <g fill="#6f7d8a"><rect x="60" y="786" width="10" height="70"/><rect x="240" y="786" width="10" height="70"/><rect x="1350" y="786" width="10" height="70"/><rect x="1530" y="786" width="10" height="70"/></g>
</svg>
</div>
<article class="paper" id="paper">
  <header class="head">
    <div>
      <svg class="goat" viewBox="0 0 96 56" aria-hidden="true">
        <g stroke="#25212b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M70 10 Q76 0 84 4" fill="none" stroke-width="3"/><path d="M66 12 Q70 2 78 4" fill="none" stroke-width="3"/>
          <path d="M14 22 C14 14 24 12 34 13 L58 13 C66 13 70 18 70 26 L68 34 C64 38 20 38 16 34 C14 30 14 26 14 22Z" fill="#fbfbf7"/>
          <path d="M14 22 L6 18" fill="none"/>
          <path d="M62 16 L68 8 C76 8 84 12 86 20 C87 24 84 28 80 28 C76 28 72 26 68 24Z" fill="#fbfbf7"/>
          <path d="M80 28 L79 36 L76 30" fill="#fbfbf7"/>
          <path d="M66 14 L58 10 L64 18Z" fill="#e2bf9c"/>
          <path d="M22 36 L21 50 M30 37 L30 50 M54 37 L55 50 M62 36 L63 50" fill="none" stroke-width="2.6"/>
        </g>
        <circle cx="76" cy="16" r="1.8" fill="#25212b"/>
      </svg>
      <h1>不服來辯</h1>
    </div>
    <div class="meta">
      <span>第 <b id="roundNo">0</b> 回合</span>
      <span>嗆贏 <b id="wins">0</b></span>
      <span>紀錄 <b id="best">0</b></span>
    </div>
  </header>

  <div class="gauge" aria-label="底氣">
    <span style="font-weight:500;min-width:auto;text-align:left">底氣</span>
    <div class="ruler" id="ruler"><i id="hpFill"></i></div>
    <span id="hpNum">100</span>
  </div>
  <p class="gauge-note">底氣歸零 = 被嘴到無話可說。每一回合老師的嘴砲都會消耗你的底氣，越後面越兇。</p>

  <!-- INTRO -->
  <section id="intro">
    <div class="with-av">
      <div class="avatar" id="avIntro"></div>
      <div>
        <p class="who">Dylan 羊老師（英文科・自稱留美）<span class="mood" id="moodIntro">準備開嘴</span></p>
        <div class="intro-lines" id="introLines"></div>
      </div>
    </div>
    <div class="stampwrap" id="stampWrap" hidden><div class="stamp" aria-label="不服來辯"><span>不</span><span>服</span><span>來</span><span>辯</span></div></div>
    <div class="row">
      <button class="btn" id="introBtn">跳過開場</button>
      <span class="hint" id="introHint">按 Enter 也可以</span>
    </div>
  </section>

  <!-- PLAY -->
  <section id="play" hidden>
    <div class="with-av">
      <div class="avatar" id="avPlay"></div>
      <div>
        <p class="who">Dylan 羊老師 <span class="mood" id="mood">得意</span></p>
        <div class="say-box" id="sayBox" title="點一下跳過打字">
          <p class="pen say" id="say"></p>
        </div>
      </div>
    </div>
    <div class="timer" id="timer"><i id="timerFill"></i></div>
    <p class="qlabel" id="qlabel">請選出最能讓老師閉嘴的回答：</p>
    <ol class="opts" id="opts"></ol>
    <div class="result" id="result" hidden>
      <div class="mark" id="mark">✓</div>
      <div class="grade" id="grade"></div>
      <div class="delta" id="delta"></div>
      <p class="pen reply" id="reply"></p>
      <div class="row">
        <button class="btn" id="nextBtn">下一回合 →</button>
        <span class="combo" id="combo"></span>
      </div>
    </div>
  </section>

  <!-- OVER -->
  <section id="over" hidden>
    <div class="with-av">
      <div class="avatar" id="avOver"></div>
      <div>
        <p class="who">Dylan 羊老師 <span class="mood hot">笑到咩咩叫</span></p>
        <p class="pen" id="finalLine"></p>
      </div>
    </div>
    <div class="over-top">
      <div class="score"><div><b id="finalScore">0</b><small>回合</small></div></div>
      <div>
        <p class="hint" style="margin:0">你被嘴到無話可說。總評：</p>
        <p class="rank" id="rank"></p>
        <p class="stats" id="stats"></p>
      </div>
    </div>
    <div class="submit" id="submitBox" hidden>
      <label for="nameInput">留下大名上排行榜</label>
      <div class="row"><input id="nameInput" maxlength="12" placeholder="你的暱稱（最多 12 字）" autocomplete="nickname"><button class="btn" id="submitBtn">上榜</button></div>
      <p class="hint" id="submitMsg" style="margin:0"></p>
    </div>
    <div class="row" style="margin-top:22px">
      <button class="btn" id="againBtn">不服，再辯一次</button>
    </div>
  </section>

  <section class="board" id="board">
    <h2>頂嘴排行榜</h2>
    <p class="hint" style="margin:2px 0 0">撐過最多回合的前 10 名，每人只留最佳紀錄</p>
    <ol id="boardList"></ol>
    <p class="hint" id="boardMsg">排行榜讀取中……</p>
  </section>
</article>
</main>

<template id="sheepTpl">
<svg class="sheep m-smug" viewBox="0 0 120 132" aria-hidden="true">

  <!-- long goat face -->

  <!-- fine spiky fringe -->
  <path d="M43 43 L44.5 30 L47 41 L49.5 26 L52 40 L54.5 23 L57 39 L59.5 21 L62 39 L64.5 22 L67 39 L69.5 25 L72 40 L74.5 28 L77 43 Q60 38 43 43Z" fill="#25212b"/>

const $=id=>document.getElementById(id);
const tpl=$('sheepTpl');
function mount(id){const c=$(id);c.appendChild(tpl.content.cloneNode(true));return c.querySelector('svg')}
const SHEEP={intro:mount('avIntro'),play:mount('avPlay'),over:mount('avOver')};
function face(w,m){SHEEP[w].setAttribute('class','sheep m-'+m)}
face('intro','talk');
let best=0; try{best=+localStorage.getItem('kevin-best')||0}catch(e){}
$('best').textContent=best;

let autoT=null, introT=null, S, typer=null, skipType=false, timerRAF=null, timerStart=0, timerDur=0, phase='intro', introIdx=0;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){S={hp:100,round:0,wins:0,combo:0,maxCombo:0,deck:shuffle(ROUNDS.map((_,i)=>i)),survived:0}}
function mult(){return 1+Math.floor(S.round/4)*.15}
function setHP(v){S.hp=Math.max(0,Math.min(100,Math.round(v)));$('hpFill').style.width=S.hp+'%';$('hpNum').textContent=S.hp;$('ruler').classList.toggle('low',S.hp<=30)}
function show(id){['intro','play','over'].forEach(s=>$(s).hidden=s!==id);$('board').hidden=id==='play'}

function typeInto(el,text,done,av){
  clearInterval(typer);skipType=false;el.textContent='';let i=0;
  document.querySelectorAll('.avatar').forEach(a=>a.classList.remove('talking'));
  if(av)$(av).classList.add('talking');
  typer=setInterval(()=>{i=skipType?text.length:i+1;el.textContent=text.slice(0,i);
    if(i>=text.length){clearInterval(typer);typer=null;if(av)$(av).classList.remove('talking');done&&done()}},14);
}

/* ---------- intro ---------- */
function introStep(){
  clearTimeout(introT);
  if(typer){skipType=true;return}
  if(introIdx<INTRO.length){
    const p=document.createElement('p');p.className='pen';$('introLines').appendChild(p);
    typeInto(p,INTRO[introIdx++],()=>{introT=setTimeout(introStep,420)},'avIntro');
    
  }else if(introIdx===INTRO.length){
    introIdx++;
    const p=document.createElement('p');p.className='pen';p.style.fontWeight='700';p.style.fontSize='24px';$('introLines').appendChild(p);
    face('intro','smug');typeInto(p,'不服來辯。',()=>{$('stampWrap').hidden=false;$('moodIntro').textContent='等你開口';$('moodIntro').className='mood hot';
      $('introBtn').textContent='開始答辯';$('introHint').textContent='撐越多回合越強';});
  }else{startGame()}
}
$('introBtn').onclick=introStep;
introT=setTimeout(introStep,400);

/* ---------- play ---------- */
function startGame(){newGame();setHP(100);$('wins').textContent=0;show('play');phase='play';nextRound()}
function nextRound(){
  if(!S.deck.length)S.deck=shuffle(ROUNDS.map((_,i)=>i));
  S.round++;S.cur=ROUNDS[S.deck.pop()];
  $('roundNo').textContent=S.round;
  // each line of trash talk wears you down
  const drain=Math.round(3*mult());
  if(S.round>1)setHP(S.hp-drain);
  if(S.hp<=0){return gameOver()}
  $('result').hidden=true;$('opts').innerHTML='';$('qlabel').style.visibility='hidden';
  $('timerFill').style.transform='scaleX(1)';$('timer').classList.remove('urgent');
  phase='typing';
  face('play',S.round%3?'smug':'sneer');
  typeInto($('say'),S.cur.t,showOptions,'avPlay');
}
$('sayBox').onclick=()=>{if(typer)skipType=true};

function showOptions(){
  phase='choose';$('qlabel').style.visibility='visible';
  S.opts=shuffle(S.cur.o);
  S.opts.forEach((o,i)=>{
    const li=document.createElement('li');const b=document.createElement('button');b.className='opt';b.id='opt'+i;
    b.innerHTML='<span class="bubble">'+'ABCD'[i]+'</span><span class="txt"></span>';
    b.querySelector('.txt').textContent=o[0];
    if(o[1]===3)b.dataset.best='1';
    b.onclick=()=>choose(i);li.appendChild(b);$('opts').appendChild(li);
  });
  timerDur=Math.max(4,9-(S.round-1)*.25)*1000;timerStart=performance.now();tick();
}
function tick(){
  const p=1-(performance.now()-timerStart)/timerDur;
  $('timerFill').style.transform='scaleX('+Math.max(0,p)+')';
  $('timer').classList.toggle('urgent',p<.3);
  if(p<=0){timerRAF=null;return choose(-1)}
  timerRAF=requestAnimationFrame(tick);
}
function choose(i){
  if(phase!=='choose')return;phase='result';
  cancelAnimationFrame(timerRAF);timerRAF=null;
  let g,reply;
  if(i<0){g=-1;reply=SILENCE[Math.random()*SILENCE.length|0]}
  else{g=S.opts[i][1];reply=S.opts[i][2]}
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('picked');else b.classList.add('faded');if(b.dataset.best&&g!==3)b.classList.add('best')});
  const m=mult();let d;
  if(g===3){S.wins++;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);d=Math.max(2,10-Math.floor(S.round/5)*2)+(S.combo>=3?5:0)}
  else{S.combo=0;d=-Math.round(({2:12,1:22,0:32,"-1":25})[g]*m)}
  setHP(S.hp+d);$('wins').textContent=S.wins;
  const [label,sym,ok]=GRADES[g];
  $('mark').textContent=sym;$('mark').className='mark'+(ok?' ok':'');
  $('grade').textContent=label;$('grade').className='grade'+(ok?' ok':'');
  $('delta').textContent='底氣 '+(d>0?'+':'−')+Math.abs(d)+(g!==3&&m>1?'（老師火力 ×'+m.toFixed(2)+'）':'');
  $('combo').textContent=S.combo>=3?'連續嗆贏 ×'+S.combo:'';
  const [mood,cls,fm]=MOODS[g];$('mood').textContent=mood;$('mood').className='mood '+cls;face('play',fm);
  // re-trigger stamp animation
  const mk=$('mark');mk.style.animation='none';void mk.offsetWidth;mk.style.animation='';
  $('result').hidden=false;
  if(!ok){$('paper').classList.remove('shake');void $('paper').offsetWidth;$('paper').classList.add('shake')}
  const lost=S.hp<=0;
  $('nextBtn').textContent=lost?'……（說不出話）':'跳過 →';
  typeInto($('reply'),reply,()=>{ autoT=setTimeout(advance,lost?1400:1100) },'avPlay');
  if(!lost)S.survived=S.round;
}
function advance(){clearTimeout(autoT);if(phase!=='result')return;if(S.hp<=0)gameOver();else nextRound()}
$('nextBtn').onclick=()=>{if(phase!=='result')return;if(typer){skipType=true;return}advance()};

/* ---------- over ---------- */
function gameOver(){
  phase='over';show('over');
  const n=S.survived;let isNew=false;
  if(n>best){best=n;isNew=true;try{localStorage.setItem('kevin-best',best)}catch(e){}}
  $('best').textContent=best;
  $('finalScore').textContent=n;
  let r=RANKS[0][1];RANKS.forEach(([min,t])=>{if(n>=min)r=t});$('rank').textContent=r;
  $('stats').innerHTML='撐過 <b>'+n+'</b> 回合 · 神回 <b>'+S.wins+'</b> 次 · 最長連勝 <b>'+S.maxCombo+'</b><br>最高紀錄 <b>'+best+'</b> 回合'+(isNew?'　<span class="new">新紀錄！</span>':'');
  face('over','laugh');
  typeInto($('finalLine'),FINAL[Math.random()*FINAL.length|0],null,'avOver');
  last={n,wins:S.wins};$('submitBox').hidden=true;offerSubmit();
}
$('againBtn').onclick=startGame;

/* ---------- leaderboard ---------- */
let LOCAL=false, DB=null, ME=null, myBest=null, myWins=0, myName='', last=null, boardRows=[];
try{myName=localStorage.getItem('dylan-name')||''}catch(e){}
function boardMsg(t){$('boardMsg').textContent=t;$('boardMsg').hidden=!t}
function renderBoard(snap){
  boardRows=snap.docs.map(d=>{const v=d.data()||{};return{id:d.id,name:(typeof v.name==='string'&&v.name.trim()?v.name:'無名氏').slice(0,12),best:Math.max(0,Math.min(999,+v.best||0)),wins:Math.max(0,Math.min(999,+v.wins||0))}});
  const ol=$('boardList');ol.innerHTML='';
  boardRows.forEach((r,i)=>{
    const li=document.createElement('li');if(r.id===ME)li.className='me';
    li.innerHTML='<span class="rk"></span><span class="nm"></span><span class="sc"></span>';
    li.querySelector('.rk').textContent=i+1;
    const nm=li.querySelector('.nm');nm.textContent=r.name;if(r.id===ME){const s=document.createElement('small');s.textContent='你';nm.appendChild(s)}
    const sc=li.querySelector('.sc');sc.textContent=r.best;const sm=document.createElement('small');sm.textContent='回合 · 神回 '+r.wins;sc.appendChild(sm);
    ol.appendChild(li);
  });
  boardMsg(boardRows.length?'':'還沒有人上榜。第一個被 Dylan 嘴爆的就是你。');
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use){return setupLocal()}
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){return setupLocal()}
    DB=db;ME=await user.id();
    try{const mine=await db.doc('scores/'+ME).get();
      if(mine.exists){const d=mine.data()||{};myBest=+d.best||0;myWins=+d.wins||0;if(!myName&&typeof d.name==='string')myName=d.name}}catch(e){}
    $('nameInput').value=myName;
    db.collection('scores').orderBy('best','desc').limit(10).onSnapshot(renderBoard,()=>boardMsg('排行榜暫時連不上，重新整理再試試。'));
    if(last&&phase==='over')offerSubmit();
  }catch(e){setupLocal()}
})();
/* per-device leaderboard when the shared one isn't available (e.g. GitHub Pages) */
function loadLocal(){try{const a=JSON.parse(localStorage.getItem('dylan-board')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveLocal(a){try{localStorage.setItem('dylan-board',JSON.stringify(a))}catch(e){}}
function renderLocal(){
  const rows=loadLocal().sort((a,b)=>b.best-a.best||b.wins-a.wins).slice(0,10);
  renderBoard({docs:rows.map(r=>({id:'n:'+r.name,data:()=>r}))});
  if(!rows.length)boardMsg('還沒有人上榜。這是這台裝置上的排行榜，借給同學玩也會記在這裡。');
}
function setupLocal(){
  if(LOCAL)return;LOCAL=true;
  $('board').querySelector('.hint').textContent='這台裝置上的前 10 名，同一個暱稱只留最佳紀錄';
  $('nameInput').value=myName;ME=myName?'n:'+myName:null;
  renderLocal();
  if(last&&phase==='over')offerSubmit();
}
function offerSubmit(){
  if(!last||(!LOCAL&&(!DB||!ME)))return;
  if(LOCAL){$('submitBox').hidden=false;$('submitBtn').disabled=false;$('submitBtn').textContent='上榜';$('submitMsg').textContent='輸入暱稱就能上榜（借給同學玩請換他的名字）。';return}
  $('submitBox').hidden=false;$('submitBtn').disabled=false;$('submitBtn').textContent='上榜';
  if(myBest!==null&&last.n<=myBest){$('submitMsg').textContent='你的最佳是 '+myBest+' 回合，這次沒超過。可以改暱稱再按一次。';$('submitBtn').textContent='更新暱稱';return}
  $('submitMsg').textContent=myBest===null?'輸入暱稱就能上榜。':'破你自己的紀錄了！';
  if(myName)submitScore();
}
async function submitScore(){
  if(!last)return;
  const name=($('nameInput').value.trim()||'無名氏').slice(0,12);
  if(LOCAL){
    if($('submitBtn').textContent==='已上榜')return;
    const a=loadLocal();const ex=a.find(r=>r.name===name);
    if(ex){if(last.n>ex.best){ex.best=last.n;ex.wins=last.wins}}else a.push({name,best:last.n,wins:last.wins});
    saveLocal(a);myName=name;ME='n:'+name;try{localStorage.setItem('dylan-name',name)}catch(e){}
    renderLocal();
    const p=boardRows.findIndex(r=>r.id===ME);const b=(ex?ex.best:last.n);
    $('submitBtn').textContent='已上榜';$('submitBtn').disabled=true;
    $('submitMsg').textContent=name+' 的最佳是 '+b+' 回合'+(p>=0?'，目前第 '+(p+1)+' 名。':'，還沒擠進前 10。');
    return;
  }
  if(!DB||!ME)return;
  const better=myBest===null||last.n>myBest;
  const best=better?last.n:myBest, wins=better?last.wins:myWins;
  $('submitBtn').disabled=true;$('submitMsg').textContent='上傳中……';
  try{
    await DB.doc('scores/'+ME).set({name,best,wins,at:Date.now()});
    myBest=best;myWins=wins;myName=name;try{localStorage.setItem('dylan-name',name)}catch(e){}
    const pos=boardRows.findIndex(r=>r.id===ME);
    $('submitMsg').textContent='已上榜：'+name+'，最佳 '+best+' 回合。';
    $('submitBtn').textContent='已上榜';
    setTimeout(()=>{const p=boardRows.findIndex(r=>r.id===ME);$('submitMsg').textContent='已上榜：'+name+'，最佳 '+best+' 回合'+(p>=0?'，目前第 '+(p+1)+' 名。':'，還沒擠進前 10。')},900);
  }catch(e){$('submitBtn').disabled=false;$('submitMsg').textContent=e&&e.code==='not_granted'?'你只有檢視權限，沒辦法上榜。請分享者給你可互動的權限。':'上傳失敗，再按一次試試。'}
}
$('submitBtn').onclick=submitScore;
$('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();submitScore()}});

/* ---------- keys ---------- */
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(phase==='intro'&&(k==='enter'||k===' ')){e.preventDefault();introStep()}
  else if(phase==='typing'&&(k==='enter'||k===' ')){e.preventDefault();skipType=true}
  else if(phase==='choose'){const idx='abcd'.indexOf(k)>=0?'abcd'.indexOf(k):'1234'.indexOf(k);if(idx>=0&&idx<4){e.preventDefault();choose(idx)}}
  else if(phase==='result'&&(k==='enter'||k===' ')&&document.activeElement!==$('nextBtn')){e.preventDefault();$('nextBtn').click()}
});
})();
</script>

</body>
</html>
